name: Publish RAOB Latest

on:
  schedule:
    # Run at minute 55 (after GFS/ECMWF builds at 15/30)
    - cron: "55 */6 * * *"
  workflow_dispatch:

concurrency:
  group: raob-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish Latest Cycle
        run: |
          # This script merges staging partials into latest.json and promotes tiles
          python scripts/publish_raob_latest.py

      - name: Update Inventory
        run: |
          # This script scans history and rebuilds inventory.json for the frontend scrubber
          python scripts/update_inventory.py

      - name: Commit and Push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add the modified files (history, latest.json, and the promoted latest tiles)
          git add data/raob/latest.json
          git add data/history
          git add tiles

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Publish latest RAOB cycle and update inventory"

          # Push with rebase loop to handle contention
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
