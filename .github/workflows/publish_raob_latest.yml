name: Publish RAOB Latest

on:
  schedule:
    - cron: "55 */6 * * *"
  workflow_dispatch:

# IMPORTANT: this only prevents *this workflow* from overlapping itself.
# It does NOT stop the GFS/ECMWF workflows from pushing at the same time.
concurrency:
  group: raob-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Rebase FIRST so we build on the latest main
      - name: Sync with main (rebase)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase --autostash origin main

      - name: Publish Latest Cycle
        run: |
          python scripts/publish_raob_latest.py

      - name: Update Inventory
        run: |
          python scripts/update_inventory.py

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raob/latest.json
          git add data/history
          git add tiles

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Publish latest RAOB cycle and update inventory"

          for attempt in 1 2 3; do
            git fetch origin main
            # autostash handles anything that appears between steps (rare but possible)
            git pull --rebase --autostash origin main || true

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected. Retrying..."
          done

          echo "ERROR: push failed after retries"
          git status --porcelain || true
          exit 1
