name: Build ECMWF 250mb Wind (Cycle-Staged)

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

concurrency:
  group: raob-cycle-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          # ADDED scipy HERE
          pip install numpy scipy xarray cfgrib eccodes rasterio matplotlib requests pandas ecmwf-opendata

      - name: Download latest available ECMWF (High Res)
        run: |
          set -e
          mkdir -p data

          python3 << 'EOF'
          from ecmwf.opendata import Client
          from datetime import datetime, timedelta
          import os
          import xarray as xr
          import numpy as np

          client = Client()
          out_path = "data/ecmwf.grib2"

          def validate_grib(path: str) -> bool:
            try:
              for sn in ("u", "v"):
                ds = xr.open_dataset(
                  path,
                  engine="cfgrib",
                  backend_kwargs={"filter_by_keys": {"shortName": sn}, "indexpath": ""}
                )
                if sn not in ds:
                  return False
                if "isobaricInhPa" not in ds.coords:
                  return False
                lev = ds["isobaricInhPa"].values
                val = float(lev) if np.ndim(lev) == 0 else float(lev[0])
                if abs(val - 250.0) > 1.0:
                  return False
              return True
            except Exception:
              return False

          def attempt(date_str, hour):
            print(f"Trying ECMWF: {date_str} {hour:02d}z")
            if os.path.exists(out_path):
              os.remove(out_path)
            try:
              client.retrieve(
                date=date_str,
                time=hour,
                step=0,
                type="fc",
                levtype="pl",
                levelist=250,
                param=["u", "v"],
                resol="0p25",
                target=out_path
              )
            except Exception as e:
              print("Download error:", e)
              return False

            try:
              sz = os.path.getsize(out_path)
            except Exception:
              sz = 0
            print("Downloaded size:", sz)
            if sz < 200_000:
              return False
            return validate_grib(out_path)

          now = datetime.utcnow() - timedelta(hours=5)
          today = now.strftime("%Y%m%d")
          yday = (now - timedelta(days=1)).strftime("%Y%m%d")

          candidates = [(today, 12), (today, 0), (yday, 12), (yday, 0)]
          for date_str, hour in candidates:
            if attempt(date_str, hour):
              print("ECMWF download OK.")
              raise SystemExit(0)

          raise SystemExit("ERROR: Could not download any candidate ECMWF cycle.")
          EOF

      - name: Generate ECMWF 250mb GeoTIFFs (Raw + Color)
        run: |
          python << 'EOF'
          import xarray as xr
          import numpy as np
          import rasterio
          from rasterio.transform import from_origin
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import os
          import json

          WEBMERC_MAXLAT = 85.05112878

          if not os.path.exists("data/ecmwf.grib2"):
              raise SystemExit("ERROR: data/ecmwf.grib2 not found.")

          ds_u = xr.open_dataset("data/ecmwf.grib2", engine="cfgrib",
              backend_kwargs={"filter_by_keys": {"shortName": "u"}, "indexpath": ""}
          )
          ds_v = xr.open_dataset("data/ecmwf.grib2", engine="cfgrib",
              backend_kwargs={"filter_by_keys": {"shortName": "v"}, "indexpath": ""}
          )

          u = ds_u["u"]
          v = ds_v["v"]
          speed = np.sqrt(u**2 + v**2) * 1.94384  # m/s -> kt

          speed = speed.assign_coords(longitude=(((speed.longitude + 180) % 360) - 180))
          speed = speed.sortby("longitude")
          speed = speed.sortby("latitude", ascending=False)
          speed = speed.sel(latitude=slice(WEBMERC_MAXLAT, -WEBMERC_MAXLAT))

          lats = speed.latitude.values
          lons = speed.longitude.values
          dx = float(abs(lons[1] - lons[0]))
          dy = float(abs(lats[1] - lats[0]))
          transform = from_origin(float(lons.min()), float(lats.max()), dx, dy)

          # 1. Write Raw GeoTIFF
          with rasterio.open("ecmwf_output_250mb_speed.tif", "w", driver="GTiff",
              height=speed.shape[0], width=speed.shape[1], count=1,
              dtype='float32', crs="EPSG:4326", transform=transform, nodata=np.nan
          ) as dst:
              dst.write(speed.values.astype('float32'), 1)

          # 2. Write Color GeoTIFF
          vmin, vmax = 20.0, 225.0
          data = np.clip(speed.values, vmin, vmax)
          norm = np.clip((data - vmin) / (vmax - vmin), 0.0, 1.0)

          turbo = plt.get_cmap('turbo')
          rgba_u8 = (turbo(norm) * 255).astype('uint8')

          with rasterio.open("ecmwf_output_250mb_color.tif", "w", driver="GTiff",
              height=rgba_u8.shape[0], width=rgba_u8.shape[1], count=3,
              dtype='uint8', crs="EPSG:4326", transform=transform
          ) as dst:
              dst.write(rgba_u8[:, :, 0], 1)
              dst.write(rgba_u8[:, :, 1], 2)
              dst.write(rgba_u8[:, :, 2], 3)

          # 3. Generate JSON Data Grid (Sidecar) for mouseover
          print("Generating JSON Grid...")
          step = 0.5
          # Interpolate to specific 0.5 grid points
          grid = speed.interp(
              latitude=np.arange(90, -90.1, -step), 
              longitude=np.arange(-180, 180, step),
              method="nearest"
          )
          vals = np.round(grid.values).astype(int)
          vals = np.where(vals < 0, -1, vals) 
          vals = np.where(np.isnan(grid.values), -1, vals)

          grid_out = {
              "lat0": 90.0, "lon0": -180.0,
              "dlat": -step, "dlon": step,
              "width": vals.shape[1], "height": vals.shape[0],
              "data": vals.flatten().tolist()
          }
          with open("grid.json", "w") as f:
              json.dump(grid_out, f, separators=(',', ':'))

          print("GeoTIFFs and Grid written successfully.")
          EOF

      - name: Fetch RAOB obs (00/12Z) -> obs_latest.csv
        run: |
          set -e
          python scripts/fetch_live_raob.py

      - name: Derive RAOB cycle string (YYYYMMDDHH) from obs_latest.csv
        run: |
          python3 << 'EOF'
          import csv
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          p = Path("data/raob/obs_latest.csv")
          with p.open("r", encoding="utf-8", newline="") as f:
              r = csv.DictReader(f)
              row = next(r)
          v = (row.get("valid_utc") or "").strip()
          if v.endswith("Z"):
              v2 = v[:-1] + "+00:00"
          else:
              v2 = v
          dt = datetime.fromisoformat(v2).astimezone(timezone.utc)
          cycle = dt.strftime("%Y%m%d%H")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RAOB_CYCLE={cycle}\n")
              env.write(f"RAOB_VALID_UTC={dt.strftime('%Y-%m-%dT%H:%M:%SZ')}\n")
          print("RAOB_CYCLE =", cycle)
          EOF

      - name: Generate ECMWF map tiles into cycle folder (zoom 0-4)
        run: |
          set -e
          rm -rf "tiles/ecmwf/${RAOB_CYCLE}"
          mkdir -p "tiles/ecmwf/${RAOB_CYCLE}"
          
          # Generate Tiles
          gdal2tiles.py --profile=mercator --xyz -r bilinear -z 0-4 \
            ecmwf_output_250mb_color.tif "tiles/ecmwf/${RAOB_CYCLE}"
          
          # Copy Sidecar Grid and Timestamp
          cp grid.json "tiles/ecmwf/${RAOB_CYCLE}/grid.json"
          date > "tiles/ecmwf/${RAOB_CYCLE}/last_update.txt"

      - name: Build staged partial JSON for ECMWF
        run: |
          set -e
          python scripts/build_raob_model_partial.py \
            --obs "data/raob/obs_latest.csv" \
            --model "ECMWF" \
            --tif "ecmwf_output_250mb_speed.tif" \
            --units "kt" \
            --out "data/raob/staging/${RAOB_CYCLE}/ECMWF.json"

      - name: Commit staged ECMWF outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "tiles/ecmwf/${RAOB_CYCLE}" "data/raob/staging/${RAOB_CYCLE}/ECMWF.json" || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Stage ECMWF for RAOB ${RAOB_CYCLE}"

          git fetch origin main
          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Rebasing..."
            git fetch origin main
            git pull --rebase origin main
          done
          exit 1
