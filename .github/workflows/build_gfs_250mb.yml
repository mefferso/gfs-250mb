name: Build GFS 250mb Wind Tiles

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install numpy xarray[complete] rasterio matplotlib requests pandas

      - name: Download GFS 250mb U/V (0.25 deg)
        run: |
          set -e
          mkdir -p data

          # switch to AWS Mirror for reliability
          python3 << 'EOF'
          import requests
          from datetime import datetime, timedelta
          import os
          import sys

          # AWS Mirror Pattern: 
          # https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.YYYYMMDD/HH/atmos/gfs.tHHz.pgrb2.0p25.f000

          # We want 00z, 06z, 12z, 18z. 
          now = datetime.utcnow()
          
          # Candidates: Check today and yesterday
          candidates = []
          for d_offset in [0, 1]:
              d = now - timedelta(days=d_offset)
              # Check cycles in reverse order (latest first)
              for h in [18, 12, 6, 0]:
                  candidates.append((d, h))

          out_path = "data/gfs_250mb.grib2"
          env_path = os.environ.get("GITHUB_ENV")

          found = False
          chosen_cycle = ""

          for (dt, hour) in candidates:
              date_str = dt.strftime("%Y%m%d")
              cycle_str = f"{hour:02d}"
              
              # Construct AWS S3 URL
              url = f"https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{date_str}/{cycle_str}/atmos/gfs.t{cycle_str}z.pgrb2.0p25.f000"
              
              print(f"Checking AWS S3: {date_str} {cycle_str}z ...")
              
              try:
                  # Stream the download
                  with requests.get(url, stream=True, timeout=20) as r:
                      if r.status_code == 200:
                          print(f"  -> Found! Downloading...")
                          with open(out_path, 'wb') as f:
                              for chunk in r.iter_content(chunk_size=1024*1024): # 1MB chunks
                                  if chunk:
                                      f.write(chunk)
                          
                          # Verify size (Full file is ~500MB, partial is invalid)
                          sz = os.path.getsize(out_path)
                          print(f"  -> Downloaded {sz / 1024 / 1024:.1f} MB")
                          
                          if sz > 10_000_000: # Ensure it's not a tiny error file
                              found = True
                              chosen_cycle = f"{date_str}{cycle_str}"
                              print(f"SUCCESS: Got GFS {chosen_cycle}")
                              break
                          else:
                              print("  -> File too small, likely invalid.")
                      else:
                          # 404 means this cycle hasn't uploaded to AWS yet
                          print(f"  -> Not available (HTTP {r.status_code})")
              except Exception as e:
                  print(f"  -> Error: {e}")

          if not found:
              print("ERROR: Could not download any GFS cycle from AWS.")
              sys.exit(1)

          if env_path:
              with open(env_path, "a") as f:
                  f.write(f"GFS_VALID_UTC={chosen_cycle}\n")
          EOF
      - name: Generate GFS 250mb GeoTIFFs (Raw + Color)
        run: |
          python << 'EOF'
          import xarray as xr
          import numpy as np
          import rasterio
          from rasterio.transform import from_origin
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import matplotlib.colors as mcolors
          import os

          # Web Mercator limits (approx 85 deg N/S)
          WEBMERC_MAXLAT = 85.05112878

          if not os.path.exists("data/gfs_250mb.grib2"):
              raise SystemExit("ERROR: data/gfs_250mb.grib2 not found.")

          # Open GRIB with xarray (cfgrib engine)
          # We filter for 250mb U and V
          # Note: cfgrib might see them as 'u' and 'v' or 'u2'/'v2' if multiple steps.
          # Here we fetched only f000 so should be simple.
          
          try:
            ds = xr.open_dataset("data/gfs_250mb.grib2", engine="cfgrib", 
                                 backend_kwargs={'filter_by_keys': {'typeOfLevel': 'isobaricInhPa', 'level': 250}})
          except Exception:
             # Fallback if keys differ
             ds = xr.open_dataset("data/gfs_250mb.grib2", engine="cfgrib")

          # We expect variables 'u' and 'v' (or 'gh' etc). Let's find u/v.
          # Usually shortName is 'u' / 'v'.
          
          u = ds['u']
          v = ds['v']
          
          # Calculate Speed (m/s -> knots)
          # 1 m/s = 1.94384 kt
          speed = np.sqrt(u**2 + v**2) * 1.94384
          
          # GFS is 0..360 longitude. We need -180..180 for standard web maps, usually.
          # Or we can keep 0..360 but let's normalize to standard WGS84 -180..180 for Rasterio.
          
          speed = speed.assign_coords(longitude=(((speed.longitude + 180) % 360) - 180))
          speed = speed.sortby("longitude")
          
          # Clip Latitude to WebMercator limits so gdal2tiles doesn't freak out
          speed = speed.sel(latitude=slice(WEBMERC_MAXLAT, -WEBMERC_MAXLAT))
          
          # Extract values and geo-transform info
          # GFS is typically 0.25 deg resolution
          lats = speed.latitude.values
          lons = speed.longitude.values
          
          # Construct Affine Transform
          # (min_lon, delta_lon, 0, max_lat, 0, delta_lat)
          # Note: GFS lats are usually descending (90 -> -90). rasterio handles negative dy.
          
          dx = float(abs(lons[1] - lons[0]))
          dy = float(abs(lats[1] - lats[0]))
          
          # West, North, x_res, y_res (negative for north-up usually? No, standard is positive dx, negative dy if top-left origin)
          # from_origin(west, north, xsize, ysize)
          transform = from_origin(float(lons.min()), float(lats.max()), dx, dy)

          # 1. Write RAW Speed (Float32) for data picking
          with rasterio.open(
              "gfs_output_250mb_speed.tif",
              "w",
              driver="GTiff",
              height=speed.shape[0],
              width=speed.shape[1],
              count=1,
              dtype='float32',
              crs="EPSG:4326",
              transform=transform,
              nodata=np.nan
          ) as dst:
              dst.write(speed.values.astype('float32'), 1)

          # 2. Write COLOR Speed (RGBA Uint8) for visualization
          # Colormap: Turbo (similar to Windy) or Jet. Let's use Turbo.
          # Range: 20 kt to 225 kt (Jetstream range)
          
          vmin, vmax = 20.0, 225.0
          data = np.clip(speed.values, vmin, vmax)
          # Normalize 0..1
          norm = np.clip((data - vmin) / (vmax - vmin), 0.0, 1.0)
          
          # Apply Colormap
          # turbo is available in recent matplotlib
          turbo = plt.get_cmap('turbo')
          # Create custom cmap with transparent for low values? 
          # Or just solid. Let's make < 20kt transparent or white.
          # Actually, let's keep it solid but use a colorbar.
          
          # Convert to RGBA
          colors = turbo(np.linspace(0, 1, 255))
          # Prepend white/transparent for bottom?
          white = np.array([[1, 1, 1, 1]]) # Opaque white for low wind
          new_colors = np.vstack((colors, white)) # Actually usually we map values. 
          
          # Let's just map standard turbo.
          # Apply to data
          # (H, W, 4) -> (4, H, W)
          
          # Let's explicitly build RGBA buffer
          # plt.cm.turbo(norm) returns float 0..1
          rgba = turbo(norm)
          
          # Convert to uint8 0..255
          rgba_u8 = (rgba * 255).astype('uint8')
          
          with rasterio.open(
              "gfs_output_250mb_color.tif",
              "w",
              driver="GTiff",
              height=rgba_u8.shape[0],
              width=rgba_u8.shape[1],
              count=3, # We'll just do RGB for tiles, or 4 for RGBA
              dtype='uint8',
              crs="EPSG:4326",
              transform=transform
          ) as dst:
              dst.write(rgba_u8[:, :, 0], 1) # R
              dst.write(rgba_u8[:, :, 1], 2) # G
              dst.write(rgba_u8[:, :, 2], 3) # B
              # dst.write(rgba_u8[:, :, 3], 4) # A

          print("GeoTIFFs written successfully.")
          EOF

      - name: Generate map tiles (zoom 0-4)
        run: |
          # Clean old tiles
          rm -rf tiles/250mb/latest
          mkdir -p tiles/250mb/latest
          
          # Use gdal2tiles to generate XYZ folder structure
          # -r bilinear for smoother look, -z 0-4 for low zoom global view
          gdal2tiles.py --profile=mercator --xyz -r bilinear -z 0-4 \
            gfs_output_250mb_color.tif tiles/250mb/latest
            
          # Timestamp
          date > tiles/250mb/latest/last_update.txt

      - name: Update Dataset (Fill GFS Data)
        run: |
          set -e
          # 1. Fetch live RAOBs first (creates data/raob/obs_latest.csv)
          python scripts/fetch_live_raob.py
          
          # 2. Merge with GFS Tiff -> creates/updates data/raob/latest.json
          python scripts/build_raob_250mb_dataset.py \
             --in "data/raob/obs_latest.csv" \
             --out "data/raob/latest.json" \
             --gfs-tif gfs_output_250mb_speed.tif \
             --gfs-units kt

      # --- NEW STEP: Archive Data ---
      - name: Archive Tiles and JSON
        run: |
          # 1. Get the cycle time
          # If GFS_VALID_UTC is set, use it. Otherwise use current hour.
          CYCLE="${GFS_VALID_UTC}"
          if [ -z "$CYCLE" ]; then CYCLE=$(date -u +"%Y%m%d%H"); fi
          
          echo "Archiving for cycle: $CYCLE"
          
          # 2. Archive GFS Tiles
          # GFS tiles are in tiles/250mb/latest
          mkdir -p tiles/250mb/$CYCLE
          cp -r tiles/250mb/latest/* tiles/250mb/$CYCLE/ || true

          # 3. Archive JSON
          mkdir -p data/history
          cp data/raob/latest.json data/history/$CYCLE.json || true

          # 4. Update Inventory & Cleanup
          python scripts/update_inventory.py

      - name: Commit updated GFS tiles + dataset
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch latest to avoid conflicts
          git fetch origin main
          git checkout main
          git pull --rebase origin main

          # Add new tiles, JSON, history, and inventory
          git add tiles/250mb/latest tiles/250mb/2* data/raob/latest.json data/history/ || true
          
          # Check status
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GFS tiles + Archive ${GFS_VALID_UTC:-unknown}"

          # Push with retry
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Rebasing..."
            git fetch origin main
            git pull --rebase origin main
          done
          exit 1
